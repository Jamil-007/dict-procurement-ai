id: delivery_acceptance
task: T5
name: Automated Document & Data Cross-Checker
description: >
  Cross-checks the receiving chain: Delivery Receipt against Inspection and
  Acceptance Report, Property Acknowledgement Receipt or Inventory Custodian
  Slip, and Warranty Certificate. Serial numbers, item descriptions,
  quantities, dates, contract numbers and the receiving party must describe
  one delivery. COA Circular No. 2023-004 requires these documents as
  supporting papers precisely because they corroborate one another; when they
  disagree, the corroboration is the thing that has failed.

  The Delivery Receipt is treated as the reference because it is the document
  contemporaneous with the physical event.

left: [delivery_receipt]
right: [iar, inspection_report, par, ics, warranty_certificate]

defaults:
  severity: high
  category: Delivery & Acceptance

compare:

  - field: contract_no
    match: normalized_exact
    severity: high
    title: The receiving documents all cite the same contract
    remediation: >
      A receiving document citing a different contract cannot corroborate
      this delivery, and a warranty citing a different contract does not
      cover the equipment received.
    authority:
      doc: COA Circular No. 2023-004
      section: "9.3.1"

  - field: supplier
    match: fuzzy
    severity: medium
    title: The receiving documents name the same supplier
    params:
      threshold: 0.88
    authority:
      doc: COA Circular No. 2023-004
      section: "9.3.1"

  # -- the goods themselves ----------------------------------------------

  - field: items
    match: item_coverage
    severity: high
    title: Every delivered item was inspected, accepted and taken up as property
    category: Property Accountability
    remediation: >
      An item on the delivery receipt with no counterpart on the IAR was
      never inspected; one with no counterpart on the PAR or ICS was never
      taken up in the property records and is not on anyone's accountability.
    authority:
      doc: COA Circular No. 2023-004
      section: "9.3.1"

  - field: items[].serial_numbers
    match: serial_set
    severity: high
    title: Serial numbers agree across the receiving documents
    category: Property Accountability
    remediation: >
      Serial numbers are the only link between the unit that arrived and the
      unit on the property records. Where they diverge, a physical count is
      the only way to establish which units the agency actually holds.
    authority:
      doc: COA Circular No. 2023-004
      section: "9.3.1"

  - field: items[].description
    match: text_equivalent
    severity: high
    title: Item descriptions agree across the receiving documents
    category: Property Accountability
    params:
      threshold: 0.82
    remediation: >
      A description that changes between the delivery receipt and the
      acceptance report means a different article was accepted from the one
      recorded as delivered.
    authority:
      doc: COA Circular No. 2023-004
      section: "9.3.1"

  - field: items[].qty
    match: numeric_tolerance
    severity: high
    title: Quantities agree across the receiving documents
    category: Property Accountability
    remediation: >
      Units delivered but not inspected, or inspected but not taken up as
      property, are unaccounted for. Reconcile the counts before the voucher
      is certified.
    authority:
      doc: COA Circular No. 2023-004
      section: "9.3.1"

  # -- sequencing ---------------------------------------------------------

  - field: dates.acceptance
    match: date_not_before
    left_field: dates.delivery
    right_field: dates.acceptance
    severity: high
    title: Acceptance did not precede delivery
    category: Delivery Sequencing
    remediation: >
      Goods accepted before they arrived means the acceptance was documented
      rather than performed. Establish the actual dates from the receiving
      logs.
    authority:
      doc: COA Circular No. 2023-004
      section: "9.3.1"

  - field: dates.inspection
    match: date_not_before
    left_field: dates.delivery
    right_field: dates.inspection
    severity: high
    title: Inspection did not precede delivery
    category: Delivery Sequencing
    authority:
      doc: COA Circular No. 2023-004
      section: "9.3.1"

  - field: dates.warranty_start
    match: date_not_before
    left_field: dates.delivery
    right_field: dates.warranty_start
    severity: medium
    title: The warranty period starts no earlier than delivery
    category: Warranty
    remediation: >
      A warranty backdated before delivery shortens the cover the agency
      actually receives.
    authority:
      doc: COA Circular No. 2023-004
      section: "9.3.1"
