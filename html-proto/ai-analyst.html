        const chip = (
          key,
          label,
          n,
        ) => `<button onclick="setKbCat('${key.replace(/'/g, "\\'")}')"
    class="rounded-full border px-3.5 py-1.5 text-[12px] font-medium whitespace-nowrap transition-colors ${state.kbCat === key ? "bg-navy border-navy text-white" : "bg-white border-line text-muted hover:border-blue hover:text-blue"}">${label}<span class="ml-1.5 ${state.kbCat === key ? "text-white/60" : "text-muted/60"}">${n}</span></button>`;

        return `<div class="max-w-[1160px]">
    ${pageHead("Knowledge Hub", "Central repository of procurement laws, policies, issuances, forms, and reference materials.")}

    <div class="flex flex-col lg:flex-row gap-3 mb-5">
      <label class="relative block lg:max-w-sm w-full">
        <i data-lucide="search" class="h-4 w-4 absolute left-3 top-1/2 -translate-y-1/2 text-muted"></i>
        <input value="${esc(state.kbSearch)}" oninput="setKbSearch(this.value)" placeholder="Search the Knowledge Hub"
          class="w-full rounded-md border border-line bg-white pl-9 pr-3 py-2 text-[13px] focus:border-blue focus:outline-none" />
      </label>
      <div class="scroll-x flex-1"><div class="flex gap-2 min-w-max pb-1">
        ${chip("all", "All", KNOWLEDGE.length)}
        ${KB_CATEGORIES.map((c) => chip(c, c, KNOWLEDGE.filter((k) => k.cat === c).length)).join("")}
      </div></div>
    </div>

    <div class="rounded-xl border border-line bg-white divide-y divide-line overflow-hidden">
      ${
        rows.length
          ? rows
              .map(
                (k, i) => `
        <div class="flex flex-col sm:flex-row sm:items-center gap-3 px-5 py-4 hover:bg-sky/40">
          <span class="h-9 w-9 rounded-md bg-sky grid place-items-center shrink-0"><i data-lucide="book-marked" class="h-4 w-4 text-blue"></i></span>
          <div class="min-w-0 flex-1">
            <div class="flex flex-wrap items-baseline gap-x-2.5">
              <span class="text-[13.5px] font-semibold text-ink">${esc(k.title)}</span>
              <span class="text-[12px] text-muted">${esc(k.subtitle)}</span>
            </div>
            <div class="text-[11.5px] text-muted mt-1">${esc(k.cat)} · ${esc(k.type)} · ${k.pages} pages · ${esc(k.date)}</div>
          </div>
          <button onclick="viewKb(${KNOWLEDGE.indexOf(k)})" class="${btnGhost} shrink-0 self-start sm:self-auto">View document</button>
        </div>`,
              )
              .join("")
          : `<div class="px-5 py-14 text-center text-[13px] text-muted">No reference material matches this search.</div>`
      }
    </div>
    <p class="text-[12px] text-muted mt-3">${rows.length} of ${KNOWLEDGE.length} references</p>
  </div>`;
      }

      function setKbCat(c) {
        state.kbCat = c;
        render();
      }
      function setKbSearch(v) {
        state.kbSearch = v;
        render();
        const i = document.querySelector(
          'input[placeholder="Search the Knowledge Hub"]',
        );
        if (i) {
          i.focus();
          i.setSelectionRange(v.length, v.length);
        }
      }

      function viewKb(i) {
        const k = KNOWLEDGE[i];
        openModal(
          `${modalHead(k.title, k.subtitle)}
    <div class="px-6 py-5">
      <div class="flex flex-wrap gap-x-6 gap-y-2 text-[12px] text-muted border-b border-line pb-4">
        <span><span class="text-ink font-medium">Category</span> · ${esc(k.cat)}</span>
        <span><span class="text-ink font-medium">Type</span> · ${esc(k.type)}</span>
        <span><span class="text-ink font-medium">Date</span> · ${esc(k.date)}</span>
        <span><span class="text-ink font-medium">Pages</span> · ${k.pages}</span>
      </div>
      <p class="text-[13.5px] leading-relaxed mt-4">${esc(k.excerpt)}</p>
      <div class="mt-4 rounded-lg border border-line bg-page px-4 py-8 text-center">
        <i data-lucide="file-text" class="h-6 w-6 text-line mx-auto"></i>
        <p class="text-[12.5px] text-muted mt-2">Document viewer is not part of this prototype.</p>
      </div>
    </div>
    <div class="flex justify-end gap-2 px-6 py-4 border-t border-line bg-page rounded-b-xl">
      <button onclick="closeModal()" class="${btnGhost}">Close</button>
      <button onclick="toast('Download prepared','${esc(k.title)}.pdf','success')" class="${btnPrimary}">Download</button>
    </div>`,
          "max-w-xl",
        );
      }

      /* ======================================================================
   WORKSPACE
   ====================================================================== */

      function workspace(p) {
        const tabs = [
          ["overview", "Overview"],
          ["documents", "Documents"],
          ["review", "AI Review"],
          ["report", "Final Report"],
          ["forms", "Form Generator"],
        ];
        return `<div class="max-w-[1160px]">
    <button onclick="go('items')" class="no-print inline-flex items-center gap-1.5 text-[12px] font-medium text-muted hover:text-blue mb-4">
      <i data-lucide="arrow-left" class="h-3.5 w-3.5"></i> All Items</button>

    <div class="no-print">
      <div class="text-[12px] font-semibold text-blue tracking-wide">${p.ref}</div>
      <h1 class="text-[19px] font-bold text-navy leading-snug mt-1 max-w-3xl">${esc(p.title)}</h1>
      <div class="flex flex-wrap items-center gap-x-5 gap-y-2 mt-3 text-[13px]">
        <span class="font-semibold tabular-nums">${peso(p.abc)}</span>
        <span class="text-muted">${esc(p.mode)}</span>
        <span class="inline-flex rounded-full border px-2.5 py-0.5 text-[11px] font-semibold ${statusChip(p.status)}">${p.status}</span>
      </div>

      <nav class="mt-6 border-b border-line flex gap-7 overflow-x-auto">
        ${tabs
          .map(
            ([k, l]) => `<button onclick="setTab('${k}')"
          class="whitespace-nowrap border-b-2 pb-2.5 text-[13px] transition-colors ${state.tab === k ? "border-blue text-navy font-semibold" : "border-transparent text-muted hover:text-navy"}">
          ${l}${k === "review" && p.review === "done" ? ` <span class="text-[11px] text-muted font-normal">${p.findings.length}</span>` : ""}</button>`,
          )
          .join("")}
      </nav>
    </div>

    <div class="mt-6">${
      state.tab === "overview"
        ? overviewTab(p)
        : state.tab === "documents"
          ? documentsTab(p)
          : state.tab === "review"
            ? reviewTab(p)
            : state.tab === "report"
              ? reportTab(p)
              : formsTab(p)
    }</div>
  </div>`;
      }

      /* ------------------------------ OVERVIEW ------------------------------ */

      function overviewTab(p) {
        const t = tally(p);
        const total = p.findings.length || 1;
        const row = (
          k,
          v,
        ) => `<div class="flex flex-col sm:flex-row sm:gap-6 py-2.5 border-b border-line last:border-0">
    <dt class="sm:w-52 shrink-0 text-[12px] font-semibold text-muted">${esc(k)}</dt>
    <dd class="text-[13px] leading-relaxed">${esc(v)}</dd></div>`;

        return `<div class="grid lg:grid-cols-3 gap-5 items-start">
    <section class="lg:col-span-2 rounded-xl border border-line bg-white">
      <h2 class="px-5 py-3 text-[13px] font-semibold text-navy border-b border-line bg-page rounded-t-xl">Procurement Details</h2>
      <dl class="px-5 py-2">
        ${row("Reference Number", p.ref)}${row("Procurement Title", p.title)}${row("ABC", peso(p.abc))}
        ${row("Procurement Mode", p.mode)}${row("Source of Fund", p.fund)}${row("Procurement Category", p.category)}
        ${row("End-User", p.endUser)}${row("Created", p.created)}${row("Last Updated", p.updated)}
      </dl>
    </section>

    <section class="rounded-xl border border-line bg-white">
      <h2 class="px-5 py-3 text-[13px] font-semibold text-navy border-b border-line bg-page rounded-t-xl">Review Summary</h2>
      <div class="px-5 py-5">
        ${
          p.review === "done"
            ? `
          <div class="flex items-baseline gap-2">
            <span class="text-[30px] font-bold text-navy leading-none tabular-nums">${p.findings.length}</span>
            <span class="text-[13px] text-muted">findings identified</span>
          </div>
          <div class="mt-4 flex h-2 rounded-full overflow-hidden bg-line">
            ${SEV_KEYS.map((k) => `<div class="${SEV[k].bar}" style="width:${(t[k] / total) * 100}%"></div>`).join("")}
          </div>
          <dl class="mt-4 space-y-2.5">
            ${SEV_KEYS.map(
              (k) =>
                `<div class="flex items-center gap-2.5 text-[13px]"><span class="h-2 w-2 rounded-full ${SEV[k].bar}"></span>${SEV[k].label}<span class="ml-auto font-semibold tabular-nums">${t[k]}</span></div>`,
            ).join("")}
            <div class="flex items-center gap-2.5 text-[13px] pt-2.5 border-t border-line"><i data-lucide="file-text" class="h-3.5 w-3.5 text-muted"></i>Documents<span class="ml-auto font-semibold tabular-nums">${p.documents.length}</span></div>
            <div class="flex items-center gap-2.5 text-[13px]"><i data-lucide="user-check" class="h-3.5 w-3.5 text-muted"></i>Reviewed by BAC<span class="ml-auto font-semibold tabular-nums">${p.findings.filter((f) => f.decision).length}</span></div>
          </dl>
          <button onclick="setTab('review')" class="${btnGhost} w-full mt-5">Open AI Review</button>
        `
            : `
          <p class="text-[13px] text-muted leading-relaxed">No AI review has been run for this procurement. The review reads the uploaded documents and lists points for the BAC to verify across five dimensions.</p>
          <dl class="mt-4 space-y-2 text-[13px]">
            <div class="flex"><dt class="text-muted">Documents uploaded</dt><dd class="ml-auto font-semibold tabular-nums">${p.documents.length}</dd></div>
          </dl>
          <button onclick="runReview()" class="${btnPrimary} w-full mt-5">Run AI Review</button>
          ${!p.documents.length ? `<p class="text-[11.5px] text-muted mt-2 text-center">Upload documents first.</p>` : ""}
        `
        }
      </div>
    </section>
  </div>`;
      }

      /* ------------------------------ DOCUMENTS ------------------------------ */

      function documentsTab(p) {
        return `<div class="space-y-5">
    <div class="flex flex-wrap items-end gap-4">
      <div><h2 class="text-[16px] font-semibold text-navy">Procurement Documents</h2>
      <p class="text-[13px] text-muted mt-1">Upload the documents associated with this procurement.</p></div>
      <button onclick="uploadModal()" class="${btnPrimary} ml-auto flex items-center gap-2"><i data-lucide="plus" class="h-4 w-4"></i> Upload Documents</button>
    </div>

    <div class="rounded-xl border border-line bg-white overflow-hidden">
      ${
        p.documents.length
          ? `
      <div class="scroll-x"><table class="w-full min-w-[780px] text-left">
        <thead><tr class="bg-page border-b border-line text-[11px] font-semibold text-muted">
          <th class="px-5 py-3">Document Name</th><th class="px-5 py-3">Type</th><th class="px-5 py-3">Pages</th>
          <th class="px-5 py-3">Uploaded</th><th class="px-5 py-3">Status</th><th class="px-5 py-3 text-right">Actions</th>
        </tr></thead>
        <tbody>${p.documents
          .map(
            (d, i) => `
          <tr class="border-b border-line last:border-0 hover:bg-sky/40">
            <td class="px-5 py-3.5">
              <div class="flex items-center gap-3"><span class="h-8 w-8 rounded-md bg-sky grid place-items-center shrink-0"><i data-lucide="file-text" class="h-4 w-4 text-blue"></i></span>
              <span class="text-[13px] font-medium">${esc(d.name)}</span></div>
            </td>
            <td class="px-5 py-3.5 text-[12.5px] text-muted">${esc(d.type)}</td>
            <td class="px-5 py-3.5 text-[12.5px] text-muted whitespace-nowrap">${d.pages} pages</td>
            <td class="px-5 py-3.5 text-[12.5px] text-muted whitespace-nowrap">${esc(d.uploaded)}</td>
            <td class="px-5 py-3.5"><span class="inline-flex items-center gap-1.5 text-[12px] font-semibold text-green-700"><i data-lucide="check" class="h-3.5 w-3.5"></i>Ready</span></td>
            <td class="px-5 py-3.5 text-right whitespace-nowrap">
              <button onclick="previewDoc(${i})" class="text-[12px] font-semibold text-blue hover:text-navy">Preview</button>
              <span class="text-line mx-2">·</span>
              <button onclick="toast('Download prepared','${esc(d.name)}','success')" class="text-[12px] font-semibold text-blue hover:text-navy">Download</button>
              <span class="text-line mx-2">·</span>
              <button onclick="removeDoc(${i})" class="text-[12px] font-semibold text-red-600 hover:text-red-700">Remove</button>
            </td>
          </tr>`,
          )
          .join("")}</tbody>
      </table></div>
      <div class="flex flex-wrap items-center gap-4 px-5 py-4 bg-page border-t border-line">
        <p class="text-[12.5px] text-muted">${p.documents.length} documents · ${p.documents.reduce((s, d) => s + d.pages, 0)} pages total</p>
        <button onclick="runReview()" class="${btnPrimary} ml-auto">${p.review === "done" ? "Run AI Review again" : "Run AI Review"}</button>
      </div>`
          : `<div class="px-5 py-16 text-center">
          <i data-lucide="upload-cloud" class="h-8 w-8 text-line mx-auto"></i>
          <div class="text-[14px] font-semibold mt-3">No documents uploaded</div>
          <p class="text-[13px] text-muted mt-1">Add the market study, TOR, specifications and supporting records.</p>
          <button onclick="uploadModal()" class="${btnPrimary} mt-4">Upload Documents</button></div>`
      }
    </div>
  </div>`;
      }

      function previewDoc(i) {
        const d = cur().documents[i];
        openModal(`${modalHead(d.name, d.type + " · " + d.pages + " pages · uploaded " + d.uploaded)}
    <div class="px-6 py-5">
      <div class="rounded-lg border border-line bg-page px-4 py-16 text-center">
        <i data-lucide="file-text" class="h-7 w-7 text-line mx-auto"></i>
        <p class="text-[12.5px] text-muted mt-2">Document viewer is not part of this prototype.</p>
      </div>
    </div>
    <div class="flex justify-end px-6 py-4 border-t border-line bg-page rounded-b-xl"><button onclick="closeModal()" class="${btnGhost}">Close</button></div>`);
      }

      function removeDoc(i) {
        const p = cur(),
          d = p.documents[i];
        openModal(`${modalHead("Remove document", d.name)}
    <div class="px-6 py-5 text-[13px] leading-relaxed">This removes ${esc(d.name)} from ${p.ref}. Findings that cite it will remain until the review is run again.</div>
    <form onsubmit="event.preventDefault();confirmRemoveDoc(${i})">${modalFoot("Remove document", "danger")}</form>`);
      }
      function confirmRemoveDoc(i) {
        const p = cur();
        const [d] = p.documents.splice(i, 1);
        p.updated = TODAY;
        closeModal();
        toast("Document removed", d.name);
        render();
      }

      function uploadModal() {
        state.staged = [];
        openModal(`${modalHead("Upload Documents", "PDF files. Uploads are simulated in this prototype.")}
    <div class="px-6 py-5">
      <button onclick="stageFiles()" class="w-full rounded-lg border-2 border-dashed border-line bg-page hover:bg-sky hover:border-blue/40 transition-colors px-6 py-8 text-center">
        <i data-lucide="upload-cloud" class="h-7 w-7 text-blue mx-auto"></i>
        <div class="text-[13px] font-semibold mt-2">Select files</div>
        <div class="text-[12px] text-muted mt-0.5">Click to add the sample procurement document set</div>
      </button>
      <div id="stage" class="mt-4 space-y-2"></div>
    </div>
    <div class="flex justify-end gap-2 px-6 py-4 border-t border-line bg-page rounded-b-xl">
      <button onclick="closeModal()" class="${btnGhost}">Cancel</button>
      <button id="upBtn" disabled onclick="commitUpload()" class="${btnPrimary} disabled:opacity-40 disabled:cursor-not-allowed">Upload</button>
    </div>`);
      }
      function stageFiles() {
        const have = cur().documents.map((d) => d.name);
        const pool = seedDocuments().filter(
          (d) =>
            !have.includes(d.name) &&
            !state.staged.some((s) => s.name === d.name),
        );
        if (!pool.length) {
          toast(
            "All sample documents are attached",
            "Nothing further to add.",
            "warn",
          );
          return;
        }
        state.staged.push(...pool);
        renderStage();
      }
      function renderStage() {
        const s = state.staged;
        $("stage").innerHTML = s.length
          ? `<div class="text-[11px] font-semibold text-muted">${s.length} file${s.length === 1 ? "" : "s"} selected</div>` +
            s
              .map(
                (f, i) => `
    <div class="flex items-center gap-3 rounded-md border border-line px-3 py-2">
      <i data-lucide="file-text" class="h-4 w-4 text-blue shrink-0"></i>
      <div class="min-w-0 flex-1"><div class="text-[13px] font-medium truncate">${esc(f.name)}</div><div class="text-[11px] text-muted">${f.pages} pages</div></div>
      <select onchange="state.staged[${i}].type=this.value" class="rounded-md border border-line px-2 py-1 text-[12px] focus:border-blue focus:outline-none">${opts(DOC_TYPES, f.type)}</select>
      <button onclick="state.staged.splice(${i},1);renderStage()" class="text-muted hover:text-red-600" aria-label="Remove"><i data-lucide="x" class="h-4 w-4"></i></button>
    </div>`,
              )
              .join("")
          : "";
        $("upBtn").disabled = !s.length;
        $("upBtn").textContent = s.length
          ? `Upload ${s.length} document${s.length === 1 ? "" : "s"}`
          : "Upload";
        icons();
      }
      function commitUpload() {
        const p = cur(),
          n = state.staged.length;
        p.documents.push(
          ...state.staged.map((f) => ({
            ...f,
            uploaded: TODAY,
            status: "Ready",
          })),
        );
        p.updated = TODAY;
        state.staged = [];
        closeModal();
        toast(
          `${n} document${n === 1 ? "" : "s"} uploaded`,
          "Ready for AI review.",
          "success",
        );
        state.tab = "documents";
        render();
      }

      /* ======================================================================
   AI REVIEW
   ====================================================================== */

      const STEPS = [
        "Documents analyzed",
        "Compliance review",
        "Document consistency review",
        "Document quality review",
        "Procurement & market review",
        "Requirements & risk review",
      ];
      let timer = null;

      function runReview() {
        const p = cur();
        if (!p.documents.length) {
          toast("No documents to review", "Upload documents first.", "warn");
          return;
        }
        p.review = "processing";
        p.step = 0;
        state.tab = "review";
        render();
        clearInterval(timer);
        timer = setInterval(() => {
          p.step++;
          if (p.step > STEPS.length) {
            clearInterval(timer);
            p.review = "done";
            if (!p.findings.length) p.findings = seedFindings();
            p.updated = TODAY;
            render();
            toast(
              "AI Review Complete",
              `${p.findings.length} findings identified`,
              "success",
            );
            return;
          }
          const h = $("procHost");
          if (h) {
            h.innerHTML = procMarkup(p);
            icons();
          }
        }, 620);
      }

      function procMarkup(p) {
        const done = p.step;
        return `<ul class="space-y-3.5">
    ${STEPS.map((s, i) => {
      const st = i < done ? "done" : i === done ? "active" : "idle";
      const mark =
        st === "done"
          ? `<i data-lucide="check" class="h-4 w-4 text-green-600"></i>`
          : st === "active"
            ? `<span class="h-3.5 w-3.5 rounded-full border-2 border-blue border-t-transparent spin"></span>`
            : `<span class="h-3.5 w-3.5 rounded-full border border-line"></span>`;
      return `<li class="flex items-center gap-3 text-[13px] ${st === "idle" ? "text-muted" : st === "active" ? "text-navy font-semibold" : "text-ink"}">
        <span class="w-4 grid place-items-center">${mark}</span>${s}</li>`;
    }).join("")}
  </ul>
  <p class="text-[12.5px] text-muted mt-6">${done >= STEPS.length ? "Consolidating findings…" : "Analyzing…"}</p>`;
      }

      function reviewTab(p) {
        if (p.review === "processing") {
          return `<div class="rounded-xl border border-line bg-white px-6 sm:px-8 py-8 max-w-xl">
      <h2 class="text-[16px] font-semibold text-navy">Reviewing Procurement Documents</h2>
      <p class="text-[13px] text-muted mt-1 mb-6">Reading ${p.documents.length} documents for ${p.ref}.</p>
      <div id="procHost">${procMarkup(p)}</div></div>`;
        }
        if (p.review !== "done") {
          return `<div class="rounded-xl border border-line bg-white px-6 py-16 text-center">
      <h2 class="text-[15px] font-semibold">No AI review has been run</h2>
      <p class="text-[13px] text-muted mt-1 max-w-md mx-auto">The review examines the uploaded documents across compliance, consistency, quality, market and risk, and lists findings for the BAC to verify.</p>
      <button onclick="runReview()" class="${btnPrimary} mt-5">Run AI Review</button></div>`;
        }

        const t = tally(p);
        const shown = p.findings.filter(
          (f) => state.dim === "all" || f.dim === state.dim,
        );
        const decided = p.findings.filter((f) => f.decision).length;

        const chip = (key, label, n) => `<button onclick="setDim('${key}')"
    class="rounded-full border px-3.5 py-1.5 text-[12px] font-medium whitespace-nowrap transition-colors ${state.dim === key ? "bg-navy border-navy text-white" : "bg-white border-line text-muted hover:border-blue hover:text-blue"}">
    ${label}<span class="ml-1.5 ${state.dim === key ? "text-white/60" : "text-muted/60"}">${n}</span></button>`;

        return `<div class="space-y-5">
    <div class="flex flex-wrap items-end gap-4">
      <div>
        <h2 class="text-[16px] font-semibold text-navy">AI Review</h2>
        <p class="text-[13px] text-muted mt-1"><span class="font-semibold text-ink">${p.findings.length} findings identified</span> · ${SEV_KEYS.filter(
          (k) => t[k],
        )
          .map((k) => `${t[k]} ${SEV[k].label.toLowerCase()}`)
          .join(" · ")}</p>
      </div>
      <div class="ml-auto flex items-center gap-2">
        <span class="text-[12px] text-muted">${decided} of ${p.findings.length} acted on</span>
        <button onclick="runReview()" class="${btnGhost} flex items-center gap-1.5"><i data-lucide="refresh-cw" class="h-3.5 w-3.5"></i> Re-run</button>
      </div>
    </div>

    <div class="flex items-start gap-2.5 rounded-lg border border-line bg-sky px-4 py-3">
      <i data-lucide="user-check" class="h-4 w-4 text-blue shrink-0 mt-0.5"></i>
      <p class="text-[12.5px] text-navy leading-relaxed">Findings and recommendations are AI-generated and require BAC review. Every analysis can be edited, commented on, accepted, modified, or rejected — a rejected finding is removed from the review. The BAC remains the decision-maker.</p>
    </div>

    <div class="flex flex-wrap items-center gap-x-4 gap-y-2">
      ${SEV_KEYS.map(
        (
          k,
        ) => `<span class="inline-flex items-center gap-1.5 text-[11.5px] text-muted" title="${esc(SEV[k].meaning)}">
        <span class="h-2 w-2 rounded-full ${SEV[k].bar}"></span><span class="font-semibold text-ink">${SEV[k].label}</span>${t[k]}</span>`,
      ).join("")}
    </div>

    <div class="scroll-x"><div class="flex gap-2 min-w-max pb-1">
      ${chip("all", "All", p.findings.length)}
      ${DIMENSIONS.map((d) => chip(d.key, d.label, p.findings.filter((f) => f.dim === d.key).length)).join("")}
    </div></div>

    ${state.dim !== "all" ? `<p class="text-[12.5px] text-muted">${esc(DIMENSIONS.find((d) => d.key === state.dim).blurb)}</p>` : ""}

    <div class="space-y-4">${shown.map((f) => findingCard(f, p)).join("")}</div>
  </div>`;
      }

      function setDim(k) {
        state.dim = k;
        render();
      }

      /* ---------------------------- Finding card ---------------------------- */

      function findingCard(f, p) {
        const s = SEV[f.severity];
        const d = f.decision ? DECISIONS[f.decision] : null;

        const evidence = f.comparison
          ? `
    <div class="grid gap-3 ${f.comparison.length > 2 ? "sm:grid-cols-3" : "sm:grid-cols-2"}">
      ${f.comparison
        .map(
          (c) => `
        <div class="rounded-lg border border-line bg-white px-3.5 py-3">
          <div class="text-[11px] font-semibold text-navy">${esc(c.doc)}</div>
          <div class="text-[10.5px] text-muted mt-0.5">Page ${c.page} · ${esc(c.label)}</div>
          <p class="quote text-ink mt-2">${esc(c.quote)}</p>
        </div>`,
        )
        .join("")}
    </div>
    ${
      f.delta
        ? `<div class="mt-3 flex items-center gap-2 text-[12px] font-semibold ${s.text}">
      <i data-lucide="git-compare-arrows" class="h-3.5 w-3.5"></i>${esc(f.delta)}</div>`
        : ""
    }`
          : `<p class="quote text-ink">${esc(f.quote)}</p>`;

        return `<article id="f-${f.id}" class="rounded-xl border border-line bg-white overflow-hidden fade-up scroll-mt-6">
    <div class="flex">
      <div class="w-1 ${s.bar} shrink-0"></div>
      <div class="flex-1 min-w-0">

        <div class="px-5 pt-4 pb-4">
          <div class="flex flex-wrap items-center gap-2">
            <span title="${esc(s.meaning)}" class="inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-[10.5px] font-bold tracking-wide ${s.chip}">
              <i data-lucide="${s.icon}" class="h-3 w-3"></i>${s.label.toUpperCase()}</span>
            <span class="text-[11px] font-semibold text-muted tracking-wide">${DIM[f.dim].toUpperCase()}</span>
            <span class="text-[11px] text-muted/70">${f.id}</span>
            ${
              d
                ? `<span class="ml-auto inline-flex items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-[11px] font-semibold ${d.chip}">
              <i data-lucide="${d.icon}" class="h-3 w-3"></i>${d.label}</span>`
                : ""
            }
          </div>

          <h3 class="text-[15px] font-semibold leading-snug mt-2.5">${esc(f.title)}</h3>

          <div class="mt-4 space-y-3.5">
            <div>
              ${sectionLbl(f.edited ? "ANALYSIS · EDITED" : "AI ANALYSIS")}
              <p class="text-[13px] leading-relaxed mt-1.5">${nl2br(f.analysis)}</p>
              ${
                f.edited
                  ? `<details class="mt-1.5"><summary class="text-[11.5px] text-blue cursor-pointer">Show original AI analysis</summary>
                <p class="text-[12.5px] text-muted leading-relaxed mt-1.5 border-l-2 border-line pl-3">${nl2br(f.aiAnalysis)}</p></details>`
                  : ""
              }
            </div>

            ${
              f.recommendation
                ? `<div>
              ${sectionLbl("RECOMMENDATION")}
              <p class="text-[13px] leading-relaxed mt-1.5">${nl2br(f.recommendation)}</p></div>`
                : ""
            }
          </div>

          <!-- Evidence -->
          <div class="mt-4 rounded-lg bg-page border border-line px-4 py-3.5">
            <div class="flex flex-wrap gap-x-8 gap-y-2.5 pb-3 mb-3 border-b border-line">
              <div><div class="text-[10px] font-semibold tracking-[0.13em] text-muted">SOURCE</div>
                <div class="text-[12.5px] font-medium mt-1">${esc(f.source.doc)}</div>
                <div class="text-[11.5px] text-muted">Page ${f.source.page} · ${esc(f.source.section)}</div></div>
              <div><div class="text-[10px] font-semibold tracking-[0.13em] text-muted">POLICY BASIS</div>
                <div class="text-[12.5px] font-medium mt-1">${esc(f.policy)}</div></div>
            </div>
            <div class="text-[10px] font-semibold tracking-[0.13em] text-muted mb-2">${f.comparison ? "COMPARED TEXT" : "CITED TEXT"}</div>
            ${evidence}
          </div>

          ${
            f.comments.length
              ? `<div class="mt-4 space-y-2.5">
            ${f.comments
              .map(
                (c) => `<div class="border-l-2 border-navy pl-3.5">
              <div class="flex items-center gap-2"><i data-lucide="message-square" class="h-3.5 w-3.5 text-navy"></i>
              <span class="text-[12px] font-semibold text-navy">Comment</span><span class="text-[11px] text-muted">${esc(c.at)}</span></div>
              <p class="text-[13px] leading-relaxed mt-1.5">${nl2br(c.text)}</p></div>`,
              )
              .join("")}
          </div>`
              : ""
          }

          ${f.decidedAt ? `<p class="text-[11.5px] text-muted mt-4">${DECISIONS[f.decision].label} · ${esc(f.decidedAt)}</p>` : ""}
        </div>

        <!-- Action bar -->
        <div class="px-5 py-3 bg-white border-t border-line flex flex-wrap items-center gap-x-4 gap-y-2">
          <button onclick="editModal('${f.id}')" class="inline-flex items-center gap-2 text-[13px] font-semibold text-blue hover:text-navy">
            <i data-lucide="pencil" class="h-4 w-4"></i>Edit Analysis</button>
          <span class="h-5 w-px bg-line"></span>
          <button onclick="commentModal('${f.id}')" class="inline-flex items-center gap-2 text-[13px] font-semibold text-blue hover:text-navy">
            <i data-lucide="message-square-plus" class="h-4 w-4"></i>Add Comment</button>

          <div class="ml-auto flex flex-wrap gap-2">
            <button onclick="rejectModal('${f.id}')"
              class="rounded-md border border-red-500 bg-white px-4 py-2 text-[13px] font-semibold text-red-600 hover:bg-red-50 transition-colors">Reject</button>
            <button onclick="decide('${f.id}','modified')"
              class="rounded-md border px-4 py-2 text-[13px] font-semibold transition-colors ${f.decision === "modified" ? "bg-navy border-navy text-white" : "border-blue bg-white text-navy hover:bg-sky"}">Modify</button>
            <button onclick="decide('${f.id}','accepted')"
              class="rounded-md border px-4 py-2 text-[13px] font-semibold transition-colors ${f.decision === "accepted" ? "bg-navy border-navy text-white" : "border-blue bg-blue text-white hover:bg-navy hover:border-navy"}">Accept</button>
          </div>
        </div>

        <!-- Feedback -->
        <div class="px-5 py-2.5 bg-page border-t border-line flex flex-wrap items-center gap-2">
          <span class="text-[12.5px] text-muted mr-1">Was this finding useful?</span>
          ${["Correct", "Incorrect", "Irrelevant", "Incomplete"]
            .map(
              (o) =>
                `<button onclick="rate('${f.id}','${o}')" class="rounded px-2 py-0.5 text-[12.5px] transition-colors ${f.feedback === o ? "bg-sky text-blue font-semibold" : "text-muted hover:text-blue"}">${o}</button>`,
            )
            .join("")}
        </div>
      </div>
    </div>
  </article>`;
      }

      const byId = (id) => cur().findings.find((f) => f.id === id);

      function decide(id, kind) {
        const f = byId(id);
        if (kind === "modified") {
          editModal(id);
          return;
        }
        f.decision = kind;
        f.decidedAt = NOW;
        cur().updated = TODAY;
        toast(
          DECISIONS[kind].label,
          f.id + " · recorded for this review",
          "success",
        );
        render();
      }

      function rejectModal(id) {
        const f = byId(id);
        openModal(`${modalHead("Reject this finding?", DIM[f.dim] + " · " + f.id)}
    <div class="px-6 py-5 text-[13px] leading-relaxed space-y-3">
      <p class="font-semibold">${esc(f.title)}</p>
      <p>Rejecting removes this finding from the review. It will not appear in the final report, and any comments recorded against it are removed with it.</p>
      <p class="text-muted">Re-running the AI review will list the findings again from the start.</p>
    </div>
    <form onsubmit="event.preventDefault();confirmReject('${id}')">${modalFoot("Reject finding", "danger")}</form>`);
      }
      function confirmReject(id) {
        const p = cur(),
          i = p.findings.findIndex((f) => f.id === id);
        if (i < 0) {
          closeModal();
          return;
        }
        const [f] = p.findings.splice(i, 1);
        p.updated = TODAY;
        closeModal();
        toast("Finding rejected", f.id + " was removed from the review.");
        render();
      }
      function rate(id, val) {
        const f = byId(id);
        f.feedback = val;
        toast("Feedback recorded", f.id + ' marked "' + val + '"');
        render();
      }

      function editModal(id) {
        const f = byId(id);
        openModal(
          `${modalHead("Edit AI Analysis", DIM[f.dim] + " · " + f.id)}
    <form onsubmit="saveEdit(event,'${id}')">
      <div class="px-6 py-5 space-y-4 max-h-[60vh] overflow-y-auto">
        <div class="flex items-start gap-2.5 rounded-md bg-sky border border-line px-3 py-2.5 text-[12px] text-navy">
          <i data-lucide="info" class="h-4 w-4 shrink-0 mt-0.5"></i>
          <span>Your version replaces the AI text in this finding and in the final report. The original wording stays available for reference.</span>
        </div>
        ${field(
          "Severity",
          `<select id="e_sev" onchange="sevHint(this.value)" class="${inputCls}">${SEV_KEYS.map((k) => `<option value="${k}" ${k === f.severity ? "selected" : ""}>${SEV[k].label}</option>`).join("")}</select>
          <p id="e_sev_hint" class="text-[11.5px] text-muted mt-1.5">${esc(SEV[f.severity].meaning)}</p>`,
        )}
        ${field("Finding", `<textarea id="e_title" rows="2" class="${areaCls}">${esc(f.title)}</textarea>`)}
        ${field("Analysis", `<textarea id="e_analysis" rows="5" class="${areaCls}">${esc(f.analysis)}</textarea>`)}
        ${field("Recommendation", `<textarea id="e_rec" rows="4" class="${areaCls}">${esc(f.recommendation)}</textarea>`)}
        ${field("Comment (optional)", `<textarea id="e_comment" rows="2" class="${areaCls}" placeholder="Verified against the signed contract on file."></textarea>`)}
      </div>
      ${modalFoot("Save Changes")}
    </form>`,
          "max-w-2xl",
        );
      }
      function sevHint(k) {
        const el = $("e_sev_hint");
        if (el) el.textContent = SEV[k].meaning;
      }

      function saveEdit(e, id) {
        e.preventDefault();
        const f = byId(id);
        f.severity = $("e_sev").value;
        f.title = $("e_title").value.trim();
        f.analysis = $("e_analysis").value.trim();
        f.recommendation = $("e_rec").value.trim();
        const c = $("e_comment").value.trim();
        if (c) f.comments.push({ text: c, at: NOW });
        f.edited = true;
        f.decision = "modified";
        f.decidedAt = NOW;
        cur().updated = TODAY;
        closeModal();
        toast(
          "Changes saved",
          "The final report will use your version.",
          "success",
        );
        render();
      }

      function commentModal(id) {
        const f = byId(id);
        openModal(`${modalHead("Add Comment", f.title)}
    <form onsubmit="saveComment(event,'${id}')">
      <div class="px-6 py-5">
        <textarea id="c_text" rows="4" required class="${areaCls}" placeholder="Confirmed with the end-user that 50 seats is correct; the Purchase Request will be amended."></textarea>
        <p class="text-[11.5px] text-muted mt-2">The comment will be dated ${NOW} and will appear in the final report.</p>
      </div>
      ${modalFoot("Add Comment")}
    </form>`);
      }
      function saveComment(e, id) {
        e.preventDefault();
        byId(id).comments.push({ text: $("c_text").value.trim(), at: NOW });
        cur().updated = TODAY;
        closeModal();
        toast(
          "Comment added",
          "It will appear in the final report.",
          "success",
        );
        render();
      }

      /* ======================================================================
   FINAL REPORT
   ====================================================================== */

      function reportTab(p) {
        if (p.review !== "done") {
          return `<div class="rounded-xl border border-line bg-white px-6 py-16 text-center">
      <h2 class="text-[15px] font-semibold">The report becomes available after the AI review</h2>
      <p class="text-[13px] text-muted mt-1">Run the review to consolidate findings into a report.</p>
      <button onclick="setTab('documents')" class="${btnPrimary} mt-5">Go to Documents</button></div>`;
        }

        const t = tally(p);
        const decided = p.findings.filter((f) => f.decision).length;

        const pending = p.findings.length - decided;

        return `<div class="space-y-4">
    <div class="no-print flex flex-wrap items-center gap-4 rounded-xl border border-line bg-white px-5 py-4">
      <span class="h-10 w-10 rounded-lg bg-sky grid place-items-center shrink-0"><i data-lucide="file-text" class="h-5 w-5 text-blue"></i></span>
      <div class="min-w-0">
        <h2 class="text-[17px] font-bold text-navy leading-tight">Final Procurement Review Report</h2>
        <p class="text-[12.5px] text-muted mt-0.5">${decided} of ${p.findings.length} findings reviewed${pending ? ` · ${pending} pending` : ""}</p>
      </div>
      <div class="ml-auto flex flex-wrap gap-2">
        <button onclick="window.print()" class="${btnGhost} flex items-center gap-2"><i data-lucide="printer" class="h-4 w-4"></i> Print Report</button>
        <button onclick="toast('PDF export prepared','${p.ref} — Final Review Report.pdf','success')" class="${btnGhost} flex items-center gap-2"><i data-lucide="download" class="h-4 w-4"></i> Download PDF</button>
        ${
          p.status === "Finalized"
            ? `<span class="inline-flex items-center gap-1.5 rounded-md border border-green-200 bg-green-50 px-3 py-2 text-[12.5px] font-semibold text-green-700"><i data-lucide="check" class="h-3.5 w-3.5"></i> Finalized</span>`
            : `<button onclick="finalizeModal()" class="${btnPrimary}">Finalize Review</button>`
        }
      </div>
    </div>

    ${
      p.status !== "Finalized" && pending
        ? `
      <div class="no-print flex flex-wrap items-center gap-4 rounded-xl border border-line bg-white px-5 py-4">
        <span class="h-8 w-8 rounded-full bg-amber-50 grid place-items-center shrink-0"><i data-lucide="alert-circle" class="h-4 w-4 text-amber-600"></i></span>
        <div class="min-w-0">
          <div class="text-[13px] font-semibold text-navy">${pending} finding${pending === 1 ? "" : "s"} pending BAC action</div>
          <p class="text-[12.5px] text-muted mt-0.5">These findings will appear in the report as pending.</p>
        </div>
        <button onclick="reviewPending()" class="ml-auto rounded-md border border-blue bg-white px-4 py-2 text-[12.5px] font-semibold text-blue hover:bg-sky transition-colors flex items-center gap-2">
          Review pending findings <i data-lucide="arrow-right" class="h-3.5 w-3.5"></i></button>
      </div>`
        : ""
    }

    ${reportDoc(p, t)}
  </div>`;
      }

      /* Jump from the report to the first finding with no recorded action. */
      function reviewPending() {
        const p = cur();
        const f = p.findings.find((x) => !x.decision);
        state.tab = "review";
        state.dim = "all";
        render();
        if (!f) {
          window.scrollTo(0, 0);
          return;
        }
        requestAnimationFrame(() => {
          const el = $("f-" + f.id);
          if (!el) {
            window.scrollTo(0, 0);
            return;
          }
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.classList.add("ring-2", "ring-blue", "ring-offset-2");
          setTimeout(
            () => el.classList.remove("ring-2", "ring-blue", "ring-offset-2"),
            2200,
          );
        });
      }

      function finalizeModal() {
        const p = cur();
        const pending = p.findings.filter((f) => !f.decision).length;
        openModal(`${modalHead("Finalize review", p.ref)}
    <div class="px-6 py-5 text-[13px] leading-relaxed space-y-3">
      <p>Finalizing sets the status of ${p.ref} to <span class="font-semibold">Finalized</span> and marks the report as the record of this review.</p>
      ${
        pending
          ? `<div class="flex items-start gap-2.5 rounded-md border border-amber-200 bg-amber-50 px-3 py-2.5">
        <i data-lucide="alert-triangle" class="h-4 w-4 text-amber-600 shrink-0 mt-0.5"></i>
        <span class="text-[12.5px] text-amber-900">${pending} finding${pending === 1 ? "" : "s"} still have no recorded action. You can finalize anyway, and they will be listed as pending.</span></div>`
          : ""
      }
      <p class="text-muted">Findings remain editable after finalization, but the change will be recorded against the report.</p>
    </div>
    <form onsubmit="event.preventDefault();confirmFinalize()">${modalFoot("Finalize Review")}</form>`);
      }
      function confirmFinalize() {
        const p = cur();
        p.status = "Finalized";
        p.updated = TODAY;
        closeModal();
        toast("Review finalized", p.ref + " is now Finalized.", "success");
        render();
      }

      /* ======================================================================
   FORM GENERATOR
   ====================================================================== */

      const FORMS = [
        "GPPB Standard Form — Invitation to Bid (ITB)",
        "GPPB Standard Form — Bid Data Sheet (BDS)",
        "BAC Resolution (Recommending Award)",
        "Notice of Award",
        "Post-Qualification Checklist",
        "Abstract of Bids",
      ];

      const PREFILL = [
        "Procurement title and reference number",
        "ABC / Budget",
        "Procurement mode",
        "End-User / Requesting Office",
        "Other available details from the record",
      ];

      const stepNum = (n) =>
        `<span class="h-7 w-7 rounded-full bg-sky text-blue grid place-items-center text-[12.5px] font-bold shrink-0">${n}</span>`;

      function formsTab(p) {
        return `<div class="space-y-5 max-w-[1000px]">
    <div class="flex items-center gap-4">
      <span class="h-11 w-11 rounded-lg bg-sky grid place-items-center shrink-0"><i data-lucide="file-text" class="h-5 w-5 text-blue"></i></span>
      <div>
        <h2 class="text-[19px] font-bold text-navy leading-tight">Form Generator</h2>
        <p class="text-[13px] text-muted mt-0.5">Draft standard procurement forms from the details on record for ${p.ref}.</p>
      </div>
    </div>

    <section class="rounded-xl border border-line bg-white overflow-hidden">

      <div class="px-6 py-5">
        <div class="flex items-start gap-3">
          ${stepNum(1)}
          <div>
            <h3 class="text-[14px] font-bold text-navy">Select a Form</h3>
            <p class="text-[12.5px] text-muted mt-0.5">Choose a standard form to generate. The form will be pre-filled with this procurement's details.</p>
          </div>
        </div>

        <div class="grid lg:grid-cols-[1fr_340px] gap-5 mt-4 lg:pl-10">
          <label class="block self-start">
            <span class="sr-only">Select Form</span>
            <span class="relative block">
              <i data-lucide="file-text" class="h-4 w-4 text-blue absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
              <select id="formPick" class="w-full appearance-none rounded-lg border border-line bg-white pl-10 pr-10 py-3 text-[13.5px] text-ink focus:border-blue focus:outline-none focus:ring-2 focus:ring-blue/15">${opts(FORMS)}</select>
              <i data-lucide="chevron-down" class="h-4 w-4 text-muted absolute right-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            </span>
          </label>

          <div class="rounded-lg bg-sky px-4 py-3.5">
            <div class="flex items-start gap-2.5">
              <span class="h-5 w-5 rounded-full bg-blue text-white grid place-items-center shrink-0 mt-px"><i data-lucide="info" class="h-3 w-3"></i></span>
              <div class="min-w-0">
                <div class="text-[12.5px] font-bold text-navy">Form will be pre-filled with:</div>
                <ul class="mt-2 space-y-1.5">
                  ${PREFILL.map(
                    (
                      x,
                    ) => `<li class="flex items-start gap-2 text-[12.5px] text-ink">
                    <i data-lucide="check" class="h-3.5 w-3.5 text-blue shrink-0 mt-0.5"></i>${esc(x)}</li>`,
                  ).join("")}
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="px-6 py-5 border-t border-line flex flex-wrap items-center gap-4">
        <div class="flex items-start gap-3">
          ${stepNum(2)}
          <div>
            <h3 class="text-[14px] font-bold text-navy">Generate</h3>
            <p class="text-[12.5px] text-muted mt-0.5">Click generate to create a draft form. Review the generated document before use.</p>
          </div>
        </div>
        <button onclick="generateForm()" class="${btnPrimary} ml-auto flex items-center gap-2 px-5 py-2.5"><i data-lucide="sparkles" class="h-4 w-4"></i> Generate Form</button>
      </div>
    </section>
  </div>`;
      }

      const pickedForm = () => $("formPick")?.value || FORMS[0];

      function generateForm() {
        toast("Draft generated", pickedForm() + " · " + cur().ref, "success");
      }

      const ACTION_LABEL = { accepted: "Accepted", modified: "Modified" };

      function reportDoc(p, t) {
        const secNum = {
          compliance: 1,
          consistency: 2,
          quality: 3,
          market: 4,
          risk: 5,
        };

        return `<div class="print-area report mx-auto max-w-[840px] bg-white border border-line rounded-xl px-8 sm:px-14 py-12">

    <header class="text-center border-b-2 border-[#123B6D] pb-6">
      <div class="font-sans text-[10.5px] tracking-[0.2em] text-[#123B6D]">REPUBLIC OF THE PHILIPPINES</div>
      <h1 class="mt-2 text-[19px] sm:text-[21px] font-bold leading-tight text-[#123B6D]">DEPARTMENT OF INFORMATION AND<br>COMMUNICATIONS TECHNOLOGY</h1>
      <div class="mt-4 text-[14px] tracking-[0.12em]">FINAL PROCUREMENT REVIEW REPORT</div>
    </header>

    <section class="mt-8 space-y-1.5">
      ${[
        ["Reference", p.ref],
        ["Procurement Title", p.title],
        ["ABC", peso(p.abc)],
        ["Procurement Mode", p.mode],
        ["Source of Fund", p.fund],
        ["End-User", p.endUser],
      ]
        .map(
          ([k, v]) =>
            `<div class="flex gap-4"><span class="w-[150px] shrink-0 font-sans text-[11px] tracking-wide text-[#555] pt-[3px]">${k.toUpperCase()}</span>
         <span class="text-[15px] flex-1">${esc(v)}</span></div>`,
        )
        .join("")}
    </section>

    <section class="mt-9 print-break">
      <h2 class="font-sans text-[12px] font-bold tracking-[0.12em] text-[#123B6D] border-b border-[#D9E5F0] pb-2">SUMMARY OF FINDINGS</h2>
      <table class="w-full mt-4 text-[15px]">
        <tbody>
          ${[
            ["Total findings", p.findings.length],
            ...SEV_KEYS.map((k) => [SEV[k].label, t[k]]),
            [
              "Findings acted on by the BAC",
              p.findings.filter((f) => f.decision).length,
            ],
          ]
            .map(
              ([k, v]) =>
                `<tr class="border-b border-[#EEF3F8]"><td class="py-1.5">${k}</td><td class="py-1.5 text-right font-semibold tabular-nums">${v}</td></tr>`,
            )
            .join("")}
        </tbody>
      </table>
      <p class="mt-4 text-[14.5px] leading-[1.7] text-justify">
        This report consolidates the AI-assisted review of ${p.documents.length} documents submitted for ${p.ref}. Findings are grouped by review dimension.
        Where an analysis has been revised, the revised text is reproduced below in place of the original. The analysis is AI-assisted and reviewed by the
        BAC; it supports, and does not replace, the determination of the Bids and Awards Committee.
      </p>
    </section>

    ${DIMENSIONS.map((dim) => {
      const list = p.findings.filter((f) => f.dim === dim.key);
      if (!list.length) return "";
      return `<section class="mt-9">
        <h2 class="font-sans text-[12px] font-bold tracking-[0.12em] text-[#123B6D] border-b border-[#D9E5F0] pb-2">
          ${secNum[dim.key]}. ${dim.label.toUpperCase()}</h2>
        <div class="divide-y divide-[#EEF3F8]">
          ${list
            .map(
              (f) => `
            <article class="py-5 print-break">
              <div class="flex flex-wrap items-baseline gap-3">
                <span class="font-sans text-[11px] font-bold ${SEV[f.severity].text}">${SEV[f.severity].label.toUpperCase()}</span>
                <span class="font-sans text-[11px] text-[#666]">${f.id}</span>
                <span class="font-sans text-[11px] ml-auto ${f.decision ? "text-[#123B6D] font-semibold" : "text-[#999]"}">
                  ${f.decision ? ACTION_LABEL[f.decision] + " · " + f.decidedAt : "Pending BAC action"}</span>
              </div>
              <h3 class="text-[16.5px] font-semibold leading-snug mt-1.5">${esc(f.title)}</h3>

              <div class="mt-2.5">
                <div class="font-sans text-[10.5px] font-semibold tracking-wide text-[#555]">${f.edited ? "ANALYSIS (AS REVISED)" : "AI ANALYSIS"}</div>
                <p class="text-[14.5px] leading-[1.7] text-justify mt-1">${nl2br(f.analysis)}</p>
              </div>

              ${
                f.recommendation
                  ? `<div class="mt-2.5">
                <div class="font-sans text-[10.5px] font-semibold tracking-wide text-[#555]">RECOMMENDATION</div>
                <p class="text-[14.5px] leading-[1.7] text-justify mt-1">${nl2br(f.recommendation)}</p></div>`
                  : ""
              }

              ${
                f.comments.length
                  ? `<div class="mt-2.5 border-l-2 border-[#123B6D] pl-4">
                <div class="font-sans text-[10.5px] font-semibold tracking-wide text-[#123B6D]">BAC COMMENT</div>
                ${f.comments.map((c) => `<p class="text-[14.5px] leading-[1.7] mt-1">${nl2br(c.text)} <span class="font-sans text-[10.5px] text-[#666]">— ${esc(c.at)}</span></p>`).join("")}
              </div>`
                  : ""
              }

              <div class="mt-2.5 font-sans text-[10.5px] text-[#666] leading-relaxed">
                Source: ${esc(f.source.doc)}, page ${f.source.page}, ${esc(f.source.section)} · Policy basis: ${esc(f.policy)}
                ${f.comparison ? "<br>Compared: " + f.comparison.map((c) => esc(c.doc) + " p." + c.page).join(" · ") : ""}
              </div>
            </article>`,
            )
            .join("")}
        </div>
      </section>`;
    }).join("")}

    <footer class="mt-11 pt-6 border-t border-[#D9E5F0]">
      <p class="text-center font-sans text-[10.5px] text-[#666]">${p.ref} · Prepared through AI Analyst · DICT</p>
      <p class="mt-1 text-center font-sans text-[10px] text-[#8a8a8a]">Prototype with fictional data. The analysis is AI-assisted and is not a legal determination.</p>
    </footer>
  </div>`;
      }

      /* ====================================================================== */
      render();
      icons();
    </script>
  </body>
</html>
