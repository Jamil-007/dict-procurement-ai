    <script>
      /* ======================================================================
   MOCK DATA — fictional records for demonstration
   ====================================================================== */

      const TODAY = "Sep 24, 2026";
      const NOW = "Sep 24, 2026 · 14:08";

      const DIMENSIONS = [
        {
          key: "compliance",
          label: "Compliance",
          blurb:
            "RA 12009, its IRR, GPPB and COA issuances, and documentary completeness.",
        },
        {
          key: "consistency",
          label: "Document Consistency",
          blurb:
            "Figures, dates, quantities and terms compared across procurement documents.",
        },
        {
          key: "quality",
          label: "Document Quality",
          blurb:
            "Structure, clarity and completeness of the TOR and technical specifications.",
        },
        {
          key: "market",
          label: "Procurement & Market",
          blurb:
            "Specification openness, ABC alignment, and existing system dependencies.",
        },
        {
          key: "risk",
          label: "Requirements & Risk",
          blurb:
            "Deliverables, warranty, payment conditions and contract obligations.",
        },
      ];
      const DIM = Object.fromEntries(DIMENSIONS.map((d) => [d.key, d.label]));

      /* Severity scale — see the review guidance: Critical · High · Medium · Low · Informational */
      const SEV = {
        critical: {
          label: "Critical",
          chip: "bg-red-50 text-red-700 border-red-200",
          bar: "bg-red-500",
          text: "text-red-700",
          icon: "alert-octagon",
          meaning: "Potentially material issue requiring prompt BAC attention",
        },
        high: {
          label: "High",
          chip: "bg-orange-50 text-orange-800 border-orange-200",
          bar: "bg-orange-500",
          text: "text-orange-700",
          icon: "alert-triangle",
          meaning:
            "Significant issue that should be resolved or explicitly reviewed before proceeding",
        },
        medium: {
          label: "Medium",
          chip: "bg-amber-50 text-amber-800 border-amber-200",
          bar: "bg-amber-400",
          text: "text-amber-700",
          icon: "alert-circle",
          meaning:
            "Meaningful issue but generally does not by itself prevent continuation",
        },
        low: {
          label: "Low",
          chip: "bg-sky text-blue border-blue/20",
          bar: "bg-blue",
          text: "text-blue",
          icon: "info",
          meaning: "Minor quality or completeness issue",
        },
        info: {
          label: "Informational",
          chip: "bg-slate-100 text-slate-600 border-slate-200",
          bar: "bg-slate-300",
          text: "text-slate-600",
          icon: "circle-check",
          meaning: "Observation rather than an identified deficiency",
        },
      };
      const SEV_KEYS = Object.keys(SEV);

      const DECISIONS = {
        accepted: {
          label: "Accepted",
          chip: "bg-green-50 text-green-700 border-green-200",
          icon: "check",
        },
        modified: {
          label: "Modified",
          chip: "bg-sky text-blue border-line",
          icon: "pencil",
        },
      };

      const DOC_TYPES = [
        "Market Study",
        "TOR",
        "Technical Specifications",
        "DCB",
        "Bidding Documents",
        "BAC Resolution",
        "Purchase Request",
        "Contract",
        "Supplier Quotation",
        "Payment Document",
        "Other",
      ];

      function seedDocuments() {
        return [
          {
            name: "Market Study.pdf",
            type: "Market Study",
            pages: 18,
            uploaded: "Sep 22, 2026",
          },
          { name: "TOR.pdf", type: "TOR", pages: 24, uploaded: "Sep 22, 2026" },
          {
            name: "Technical Specifications.pdf",
            type: "Technical Specifications",
            pages: 31,
            uploaded: "Sep 22, 2026",
          },
          { name: "DCB.pdf", type: "DCB", pages: 9, uploaded: "Sep 23, 2026" },
          {
            name: "Bidding Documents.pdf",
            type: "Bidding Documents",
            pages: 64,
            uploaded: "Sep 23, 2026",
          },
          {
            name: "BAC Resolution No. 01.pdf",
            type: "BAC Resolution",
            pages: 3,
            uploaded: "Sep 23, 2026",
          },
          {
            name: "BAC Resolution No. 02.pdf",
            type: "BAC Resolution",
            pages: 3,
            uploaded: "Sep 23, 2026",
          },
          {
            name: "Purchase Request.pdf",
            type: "Purchase Request",
            pages: 2,
            uploaded: "Sep 24, 2026",
          },
          {
            name: "Contract.pdf",
            type: "Contract",
            pages: 28,
            uploaded: "Sep 24, 2026",
          },
        ].map((d) => ({ ...d, status: "Ready" }));
      }

      /* ---- 15 findings: 2 critical · 4 high · 3 medium · 1 low · 5 informational ---- */
      function seedFindings() {
        const f = (o) => ({
          decision: null,
          decidedAt: null,
          comments: [],
          feedback: null,
          edited: false,
          aiAnalysis: o.analysis,
          aiRecommendation: o.recommendation || "",
          ...o,
        });
        return [
          /* ---------------- COMPLIANCE ---------------- */
          f({
            id: "AI-01",
            dim: "compliance",
            severity: "critical",
            title: "Required provision not found in the Bidding Documents",
            analysis:
              "The Instructions to Bidders does not carry the provision on the submission of the Bid Securing Declaration that the applicable procurement rule requires for this modality. Section 8 moves from bid security forms directly to the opening of bids.",
            recommendation:
              "Review Section 8 against the standard bidding document and insert the missing provision before the invitation to bid is published.",
            source: {
              doc: "Bidding Documents.pdf",
              page: 24,
              section: "Section 8 — Bid Security",
            },
            policy: "RA 12009 IRR",
            quote:
              '"8.3 The Bidder shall submit bid security in any of the following forms and amounts: (a) cash or cashier’s check; (b) bank draft or guarantee; (c) surety bond. 8.4 Bid securities shall be returned..."',
          }),

          f({
            id: "AI-02",
            dim: "compliance",
            severity: "high",
            title: "BAC Resolution No. 02 is missing a signature and a date",
            analysis:
              "The signature block for one committee member is blank and the date of approval is not filled in. The resolution is otherwise complete.",
            recommendation:
              "Secure the remaining signature and encode the date of approval before the resolution is attached to the procurement record.",
            source: {
              doc: "BAC Resolution No. 02.pdf",
              page: 3,
              section: "Signature page",
            },
            policy: "RA 12009 IRR · Documentary requirements",
            quote:
              '"APPROVED this ____ day of __________, 2026.   _______________________ (Member, Bids and Awards Committee)"',
          }),

          f({
            id: "AI-03",
            dim: "compliance",
            severity: "info",
            title: "Procurement mode is consistent with the approved budget",
            analysis:
              "Competitive bidding is consistent with the ABC of ₱17,339,609.00 and with the nature of the requirement. The eligibility documents enumerated in the Bidding Documents match the checklist in the DCB.",
            recommendation: "",
            source: {
              doc: "Bidding Documents.pdf",
              page: 6,
              section: "Section 1 — Invitation to Bid",
            },
            policy: "RA 12009",
            quote:
              '"The Department of Information and Communications Technology invites bids for the Procurement of One (1) Year Subscription of the Cyber Risk Assessment and Baseline Scoring Tool with an ABC of ₱17,339,609.00."',
          }),

          /* ------------- DOCUMENT CONSISTENCY ------------- */
          f({
            id: "AI-04",
            dim: "consistency",
            severity: "critical",
            title: "Contract amount and payment document differ by ₱600,000.00",
            analysis:
              "The contract price and the amount stated on the disbursement voucher do not match. The difference of ₱600,000.00 is not explained by any variation order or supplemental agreement in the uploaded records.",
            recommendation:
              "Trace the ₱600,000.00 difference to a supporting document. If no variation order exists, return the payment document to the end-user for correction before processing.",
            source: {
              doc: "Contract.pdf",
              page: 4,
              section: "Article III — Contract Price",
            },
            policy: "COA Circular · Documentation of disbursements",
            comparison: [
              {
                doc: "Contract.pdf",
                page: 4,
                label: "Contract price",
                quote:
                  '"The CONTRACT PRICE shall be Seventeen Million One Hundred Fifty Thousand Pesos (₱17,150,000.00), inclusive of all applicable taxes."',
              },
              {
                doc: "Payment Document.pdf",
                page: 1,
                label: "Amount claimed",
                quote:
                  '"Gross amount due: ₱17,750,000.00 — First and final billing for one (1) year subscription."',
              },
            ],
            delta: "Unreconciled difference of ₱600,000.00",
          }),

          f({
            id: "AI-05",
            dim: "consistency",
            severity: "high",
            title: "Licence quantity differs across three documents",
            analysis:
              "The number of licence seats is stated as 50 in the Market Study and the Technical Specifications, but as 45 in the Purchase Request. The ABC appears to have been computed on 50 seats.",
            recommendation:
              "Confirm the correct number of seats with the end-user and reflect one figure across the Purchase Request, Market Study and Technical Specifications.",
            source: {
              doc: "Purchase Request.pdf",
              page: 3,
              section: "Item description",
            },
            policy: "Internal consistency check",
            comparison: [
              {
                doc: "Market Study.pdf",
                page: 7,
                label: "Quantity",
                quote:
                  '"Indicative requirement: fifty (50) assessor seats for one (1) year."',
              },
              {
                doc: "Technical Specifications.pdf",
                page: 12,
                label: "Quantity",
                quote:
                  '"The subscription shall cover fifty (50) named user seats."',
              },
              {
                doc: "Purchase Request.pdf",
                page: 3,
                label: "Quantity",
                quote:
                  '"Qty: 45 seats — Annual subscription, cyber risk assessment and baseline scoring tool."',
              },
            ],
            delta:
              "5 seats unaccounted for between the Purchase Request and the specifications",
          }),

          f({
            id: "AI-06",
            dim: "consistency",
            severity: "info",
            title:
              "ABC is stated consistently across the procurement documents",
            analysis:
              "The ABC of ₱17,339,609.00 appears identically in the Market Study, the Purchase Request, the Bidding Documents and BAC Resolution No. 01.",
            recommendation: "",
            source: {
              doc: "Market Study.pdf",
              page: 9,
              section: "Cost estimate",
            },
            policy: "Internal consistency check",
            comparison: [
              {
                doc: "Market Study.pdf",
                page: 9,
                label: "ABC",
                quote: '"Estimated budget requirement: ₱17,339,609.00"',
              },
              {
                doc: "Purchase Request.pdf",
                page: 1,
                label: "ABC",
                quote: '"Estimated cost: ₱17,339,609.00"',
              },
            ],
          }),

          /* ---------------- DOCUMENT QUALITY ---------------- */
          f({
            id: "AI-07",
            dim: "quality",
            severity: "medium",
            title:
              "Post-qualification requirements appear inside the technical specifications",
            analysis:
              "Section 4 of the TOR lists post-qualification documentary requirements within the technical specifications. Bidders reading the specifications may treat these as technical criteria rather than post-qualification requirements.",
            recommendation:
              "Move the post-qualification requirements to the appropriate section of the procurement documents and cross-reference them from the TOR.",
            source: {
              doc: "TOR.pdf",
              page: 11,
              section: "Section 4 — Technical Specifications",
            },
            policy: "Document structure · Standard procurement forms",
            quote:
              '"4.7 The winning bidder shall submit, within five (5) calendar days from notice, its latest audited financial statements, certificate of authorised reseller status, and the résumés of assigned personnel."',
          }),

          f({
            id: "AI-08",
            dim: "quality",
            severity: "info",
            title: "Technical requirements are stated in measurable terms",
            analysis:
              "The performance requirements in Sections 5 and 6 are expressed with measurable thresholds for scan coverage, reporting frequency and uptime, which supports objective evaluation.",
            recommendation: "",
            source: {
              doc: "Technical Specifications.pdf",
              page: 17,
              section: "Section 5 — Performance Requirements",
            },
            policy: "Document quality review",
            quote:
              '"The platform shall complete a full baseline assessment of all enrolled assets within seventy-two (72) hours and maintain 99.5% monthly availability."',
          }),

          f({
            id: "AI-15",
            dim: "quality",
            severity: "low",
            title: "Subscription period is written in two different ways",
            analysis:
              'The TOR refers to the engagement as a "one (1) year subscription" in Section 2 and as a "twelve (12) month subscription" in Section 6. Both describe the same period, so the requirement remains understandable.',
            recommendation:
              "Use one wording throughout the TOR for consistency with the title of the procurement.",
            source: {
              doc: "TOR.pdf",
              page: 6,
              section: "Section 2 — Background",
            },
            policy: "Document quality review",
            quote:
              '"2.1 The agency intends to procure a one (1) year subscription… 6.2 The twelve (12) month subscription shall commence upon activation."',
          }),

          /* ---------------- PROCUREMENT & MARKET ---------------- */
          f({
            id: "AI-09",
            dim: "market",
            severity: "high",
            title:
              "Specification may correspond closely to one commercial product",
            analysis:
              "The combination of a named scoring methodology, a fixed dashboard layout and a specific export format narrows the field to configurations offered by a small number of providers. This is a potential concern that requires BAC review; it is not, on its own, a determination that the specification is restrictive.",
            recommendation:
              'Restate the requirement in terms of the outcome needed, or retain the reference with "or equivalent" and publish the equivalence criteria.',
            source: {
              doc: "Technical Specifications.pdf",
              page: 14,
              section: "Section 4.2 — Scoring Engine",
            },
            policy: "RA 12009 · Non-restrictive specifications",
            quote:
              '"The scoring engine shall implement the vendor’s proprietary baseline index and export results in its native .brx format for ingestion by the agency dashboard."',
          }),

          f({
            id: "AI-10",
            dim: "market",
            severity: "medium",
            title:
              "Configuration may warrant further market validation against the ABC",
            analysis:
              "The Market Study cites two providers for a 50-seat configuration. The ABC sits within 3% of both quotations, which gives a narrow basis for concluding that it reflects prevailing market prices for the requested scope.",
            recommendation:
              "Obtain one further quotation or a published price reference, and record in the Market Study how the ABC was derived.",
            source: {
              doc: "Market Study.pdf",
              page: 8,
              section: "Price canvass",
            },
            policy: "RA 12009 · Determination of the ABC",
            quote:
              '"Provider A: ₱17,420,000.00 · Provider B: ₱17,680,000.00 · Average of canvassed offers used as basis for the ABC."',
          }),

          f({
            id: "AI-11",
            dim: "market",
            severity: "info",
            title: "Dependency on an existing system is disclosed",
            analysis:
              "The TOR states that the subscription must integrate with the agency security operations platform procured in 2024 and identifies the interface involved, so bidders can price the integration work.",
            recommendation: "",
            source: {
              doc: "TOR.pdf",
              page: 15,
              section: "Section 7 — Integration",
            },
            policy: "Existing contract and system compatibility",
            quote:
              '"The solution shall integrate with the agency’s existing security operations platform (Contract No. DICT-2024-118) through its documented REST interface."',
          }),

          /* ---------------- REQUIREMENTS & RISK ---------------- */
          f({
            id: "AI-12",
            dim: "risk",
            severity: "high",
            title: "Final deliverables are not clearly defined",
            analysis:
              "The TOR describes the service to be subscribed to but does not state what the agency receives at the end of the subscription period, such as assessment reports, exported data or a closing baseline report.",
            recommendation:
              "List the expected deliverables and their format and due dates in the TOR so acceptance can be assessed against them.",
            source: {
              doc: "TOR.pdf",
              page: 19,
              section: "Section 6 — Scope of Services",
            },
            policy: "Requirements completeness",
            quote:
              '"The service provider shall provide continuous cyber risk assessment and baseline scoring for the duration of the subscription."',
          }),

          f({
            id: "AI-13",
            dim: "risk",
            severity: "medium",
            title: "Warranty and support period are not defined",
            analysis:
              "The technical specifications require technical support but do not state the support hours, response times or the period covered after the subscription ends.",
            recommendation:
              "State the support window, the response and resolution targets, and what support continues after expiry of the subscription.",
            source: {
              doc: "Technical Specifications.pdf",
              page: 22,
              section: "Section 8 — Support",
            },
            policy: "Contract obligations",
            quote:
              '"The provider shall render technical support for the duration of the engagement."',
          }),

          f({
            id: "AI-14",
            dim: "risk",
            severity: "info",
            title: "Payment milestones and acceptance conditions are defined",
            analysis:
              "The contract sets out two payment milestones tied to activation and to the issuance of the certificate of acceptance, and lists the supporting documents required for each claim.",
            recommendation: "",
            source: {
              doc: "Contract.pdf",
              page: 11,
              section: "Article VI — Terms of Payment",
            },
            policy: "COA Circular · Documentation of disbursements",
            quote:
              '"Payment shall be released in two (2) tranches: 50% upon activation and acceptance testing, and 50% upon issuance of the Certificate of Final Acceptance."',
          }),
        ];
      }

      let procurements = [
        {
          ref: "PROC-2026-001",
          title:
            "Procurement of One (1) Year Subscription of the Cyber Risk Assessment and Baseline Scoring Tool",
          abc: 17339609,
          mode: "Competitive Bidding",
          fund: "GAA",
          category: "ICT / Software Subscription",
          endUser: "Emerging Technologies Group",
          created: "Sep 20, 2026",
          updated: "Sep 24, 2026",
          status: "Ongoing",
          documents: seedDocuments(),
          review: "done",
          findings: seedFindings(),
        },
        {
          ref: "PROC-2026-002",
          title:
            "Procurement of Network Switches and Structured Cabling for Regional Offices",
          abc: 8500000,
          mode: "Competitive Bidding",
          fund: "GAA",
          category: "ICT / Network Infrastructure",
          endUser: "Infrastructure Management Service",
          created: "Sep 15, 2026",
          updated: "Sep 21, 2026",
          status: "Ongoing",
          documents: seedDocuments().slice(0, 4),
          review: "none",
          findings: [],
        },
        {
          ref: "PROC-2026-003",
          title: "Renewal of Enterprise Cloud Hosting Services",
          abc: 4200000,
          mode: "Competitive Bidding",
          fund: "GAA",
          category: "ICT / Cloud Services",
          endUser: "Cybersecurity Bureau",
          created: "Aug 28, 2026",
          updated: "Sep 12, 2026",
          status: "Finalized",
          documents: seedDocuments().slice(0, 6),
          review: "done",
          findings: seedFindings().slice(0, 6),
        },
      ];

      /* ---------------- Knowledge Hub ---------------- */
      const KB_CATEGORIES = [
        "Laws & Regulations",
        "GPPB Issuances",
        "COA Issuances",
        "DICT Policies",
        "Standard Forms",
        "Jurisprudence & Cases",
      ];

      const KNOWLEDGE = [
        {
          title: "RA 12009",
          subtitle: "New Government Procurement Act",
          cat: "Laws & Regulations",
          type: "Republic Act",
          date: "Jul 20, 2024",
          pages: 96,
          excerpt:
            "An act providing for the modernisation, standardisation and regulation of the procurement activities of the government, repealing Republic Act No. 9184.",
        },
        {
          title: "RA 12009 IRR",

      /* ======================================================================

      const state = {
        page: "items", // items | assistant | hub | workspace
        tab: "overview", // overview | documents | review | report | forms
        ref: null,
        dim: "all",
        kbCat: "all",
        kbSearch: "",

        chat: { docs: [], msgs: [], busy: false },
      };

      const NAV = [
        { key: "items", label: "All Items", icon: "layout-list" },
        {
          key: "assistant",
          label: "Procurement Analyst",

        { key: "hub", label: "Knowledge Hub", icon: "library" },
      ];

      /* ======================================================================

   ====================================================================== */

      const $ = (id) => document.getElementById(id);
      const esc = (s = "") =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const nl2br = (s = "") => esc(s).replace(/\n/g, "<br>");
      const peso = (n) =>
        "₱" +
        Number(n || 0).toLocaleString("en-PH", {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        });
      const cur = () => procurements.find((p) => p.ref === state.ref);
      const icons = () => {
        if (window.lucide) lucide.createIcons();
      };
      const sidebar = (open) => {
        $("sidebar").classList.toggle("-translate-x-full", !open);
        $("scrim").classList.toggle("hidden", !open);
      };

      function tally(p) {
        const t = Object.fromEntries(SEV_KEYS.map((k) => [k, 0]));
        (p.findings || []).forEach((f) => {
          if (t[f.severity] !== undefined) t[f.severity]++;
        });
        return t;
      }
      const statusChip = (s) =>
        s === "Finalized"
          ? "bg-green-50 text-green-700 border-green-200"
          : "bg-sky text-blue border-line";

      /* ------------------------------ UI atoms ------------------------------ */
      const btnPrimary =
        "rounded-md bg-blue px-4 py-2 text-[13px] font-semibold text-white hover:bg-navy transition-colors";

        "rounded-md border border-line bg-white px-3.5 py-2 text-[13px] font-medium text-ink hover:bg-sky transition-colors";

        "w-full rounded-md border border-line bg-white px-3 py-2 text-[13px] text-ink focus:border-blue focus:outline-none focus:ring-2 focus:ring-blue/15";
      const areaCls = inputCls + " leading-relaxed resize-y";
      const field = (l, inner) =>
        `<label class="block"><span class="block text-[12px] font-semibold text-ink mb-1.5">${esc(l)}</span>${inner}</label>`;
      const opts = (arr, sel) =>
        arr
          .map(
            (o) => `<option ${o === sel ? "selected" : ""}>${esc(o)}</option>`,
          )
          .join("");
      const sectionLbl = (t) =>
        `<div class="text-[10px] font-semibold tracking-[0.13em] text-muted">${t}</div>`;

      function toast(title, sub = "", kind = "info") {
        const ic = {
          info: "info",
          success: "check-circle-2",
          warn: "alert-triangle",
        }[kind];
        const tone = {
          info: "text-blue",
          success: "text-green-600",
          warn: "text-amber-600",
        }[kind];
        const el = document.createElement("div");
        el.className =
          "fade-up w-[320px] rounded-lg border border-line bg-white shadow-lg px-4 py-3 flex gap-3";
        el.innerHTML = `<i data-lucide="${ic}" class="h-[18px] w-[18px] ${tone} shrink-0 mt-0.5"></i>
    <div class="min-w-0"><div class="text-[13px] font-semibold">${esc(title)}</div>
    ${sub ? `<div class="text-[12px] text-muted mt-0.5">${esc(sub)}</div>` : ""}</div>`;
        $("toastRoot").appendChild(el);
        icons();
        setTimeout(() => el.remove(), 4000);
      }

      function openModal(html, width = "max-w-lg") {
        $("modalRoot").innerHTML =
          `<div class="fixed inset-0 z-50 flex items-start sm:items-center justify-center p-4 overflow-y-auto">
    <div class="fixed inset-0 bg-navy/40" onclick="closeModal()"></div>
    <div role="dialog" aria-modal="true" class="relative w-full ${width} my-8 rounded-xl bg-white border border-line shadow-xl">${html}</div></div>`;
        icons();
        const f = $("modalRoot").querySelector("input,textarea,select");
        if (f) f.focus();
      }
      const closeModal = () => {
        $("modalRoot").innerHTML = "";
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      const modalHead = (
        title,
        sub = "",
      ) => `<div class="flex items-start gap-4 px-6 pt-5 pb-4 border-b border-line">
  <div class="min-w-0"><h2 class="text-[16px] font-semibold text-navy">${esc(title)}</h2>
  ${sub ? `<p class="text-[12.5px] text-muted mt-0.5">${esc(sub)}</p>` : ""}</div>
  <button onclick="closeModal()" class="ml-auto text-muted hover:text-ink" aria-label="Close"><i data-lucide="x" class="h-[18px] w-[18px]"></i></button></div>`;
      const modalFoot = (
        submitLabel,
        tone = "primary",
      ) => `<div class="flex justify-end gap-2 px-6 py-4 border-t border-line bg-page rounded-b-xl">
  <button type="button" onclick="closeModal()" class="${btnGhost}">Cancel</button>
  <button type="submit" class="${tone === "danger" ? "rounded-md bg-red-600 px-4 py-2 text-[13px] font-semibold text-white hover:bg-red-700" : btnPrimary}">${esc(submitLabel)}</button></div>`;

      /* ======================================================================

   ====================================================================== */

      function render() {
        $("navList").innerHTML = NAV.map((n) => {
          const on =
            state.page === n.key ||
            (n.key === "items" && state.page === "workspace");
          return `<li><button onclick="go('${n.key}')" class="w-full flex items-center gap-2.5 rounded-md px-3 py-2 text-[13px] transition-colors ${on ? "bg-white/15 text-white font-semibold" : "text-white/70 hover:bg-white/10"}">
      <i data-lucide="${n.icon}" class="h-[16px] w-[16px]"></i>${n.label}</button></li>`;
        }).join("");

        $("main").innerHTML =
          state.page === "workspace" && cur()
            ? workspace(cur())
            : state.page === "hub"
              ? hubPage()
              : state.page === "assistant"
                ? assistantPage()
                : itemsPage();
        icons();
        if (state.page === "assistant") scrollChat();

      function go(key) {
        state.page = key;
        sidebar(false);
        render();
        window.scrollTo(0, 0);
      }
      function open_(ref) {
        state.ref = ref;
        state.page = "workspace";
        state.tab = cur().review === "done" ? "review" : "overview";
        state.dim = "all";
        render();
        window.scrollTo(0, 0);
      }
      function setTab(t) {
        state.tab = t;
        render();
        window.scrollTo(0, 0);
      }

      const pageHead = (title, sub, action = "") => `
  <div class="flex flex-wrap items-end gap-4 mb-6">
    <div><h1 class="text-[21px] font-bold text-navy tracking-tight">${esc(title)}</h1>
    <p class="text-[13px] text-muted mt-1 max-w-2xl">${esc(sub)}</p></div>
    ${action ? `<div class="ml-auto">${action}</div>` : ""}
  </div>`;

      /* ======================================================================

      function itemsPage() {
        return `<div class="max-w-[1160px]">

      "All Items",

      `<button onclick="newProcurement()" class="${btnPrimary} flex items-center gap-2"><i data-lucide="plus" class="h-4 w-4"></i> New Procurement</button>`,

    <div class="rounded-xl border border-line bg-white overflow-hidden">
      <div class="scroll-x"><table class="w-full min-w-[920px] text-left">
        <thead><tr class="bg-page border-b border-line text-[11px] font-semibold text-muted">

            <td class="px-5 py-4 align-top">

              <div class="text-[11.5px] text-muted mt-1">${esc(p.category)} · ${p.documents.length} documents${p.review === "done" ? ` · ${p.findings.length} findings (${t.critical} critical · ${t.high} high)` : " · review not yet run"}</div>
            </td>
            <td class="px-5 py-4 align-top text-[13px] text-right whitespace-nowrap tabular-nums">${peso(p.abc)}</td>
            <td class="px-5 py-4 align-top text-[13px] text-muted whitespace-nowrap">${esc(p.mode)}</td>
            <td class="px-5 py-4 align-top"><span class="inline-flex rounded-full border px-2.5 py-0.5 text-[11px] font-semibold ${statusChip(p.status)}">${p.status}</span></td>
            <td class="px-5 py-4 align-top text-[13px] text-muted whitespace-nowrap">${p.updated}</td>
            <td class="px-5 py-4 align-top text-right">
              <button onclick="event.stopPropagation();deleteProcurementModal('${p.ref}')" aria-label="Delete ${esc(p.ref)}" title="Delete"

                <i data-lucide="trash-2" class="h-4 w-4"></i></button></td>
          </tr>`;
          })
          .join("")}</tbody>
      </table></div>
    </div>
  </div>`;
      }

      function deleteProcurementModal(ref) {
        const p = procurements.find((x) => x.ref === ref);
        openModal(`${modalHead("Delete procurement?", ref)}
    <div class="px-6 py-5 text-[13px] leading-relaxed space-y-3">
      <p class="font-semibold">${esc(p.title)}</p>
      <p>This removes the record together with its ${p.documents.length} document${p.documents.length === 1 ? "" : "s"}${p.review === "done" ? `, its ${p.findings.length} findings and the final report` : ""}.</p>
      <p class="text-muted">The procurement cannot be recovered from this prototype.</p>
    </div>
    <form onsubmit="event.preventDefault();confirmDeleteProcurement('${ref}')">${modalFoot("Delete procurement", "danger")}</form>`);
      }
      function confirmDeleteProcurement(ref) {
        const i = procurements.findIndex((x) => x.ref === ref);
        if (i < 0) {
          closeModal();
          return;
        }
        procurements.splice(i, 1);
        if (state.ref === ref) {
          state.ref = null;
          state.page = "items";
        }
        closeModal();
        toast("Procurement deleted", ref);
        render();
      }

      /* ---------------------------- New procurement ---------------------------- */
      function newProcurement() {
        openModal(
          `${modalHead("New Procurement", "Create a procurement record, then upload its documents.")}
    <form onsubmit="createProcurement(event)">
      <div class="px-6 py-5 space-y-4">
        ${sectionLbl("PROCUREMENT INFORMATION")}
        ${field("Procurement Title", `<textarea id="n_title" rows="2" required class="${areaCls}" placeholder="Procurement of One (1) Year Subscription of the Cyber Risk Assessment and Baseline Scoring Tool"></textarea>`)}

          ${field("ABC", `<div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-muted text-[13px]">&#8369;</span><input id="n_abc" required inputmode="decimal" class="${inputCls} pl-7" placeholder="17,339,609.00" /></div>`)}
          ${field("Procurement Mode", `<select id="n_mode" class="${inputCls}">${opts(["Competitive Bidding", "Small Value Procurement", "Direct Contracting", "Negotiated Procurement", "Repeat Order"])}</select>`)}
          ${field("Source of Fund", `<select id="n_fund" class="${inputCls}">${opts(["GAA", "Trust Fund", "Special Account", "Continuing Appropriation"])}</select>`)}
          ${field("Procurement Category", `<input id="n_cat" class="${inputCls}" placeholder="ICT / Software Subscription" />`)}

        ${field("End-User / Requesting Office", `<input id="n_user" class="${inputCls}" placeholder="Emerging Technologies Group" />`)}

        </label>
      </div>
      ${modalFoot("Create Procurement")}
    </form>`,
          "max-w-2xl",

      function createProcurement(e) {
        e.preventDefault();
        const ref =
          "PROC-2026-" + String(procurements.length + 1).padStart(3, "0");
        procurements.push({
          ref,
          title: $("n_title").value.trim(),
          abc: Number(($("n_abc").value || "0").replace(/[^\d.]/g, "")) || 0,
          mode: $("n_mode").value,
          fund: $("n_fund").value,
          category: $("n_cat").value.trim() || "ICT",
          endUser: $("n_user").value.trim() || "Not specified",
          created: TODAY,
          updated: TODAY,
          status: "Ongoing",
          documents: $("n_seed").checked ? seedDocuments() : [],
          review: "none",
          findings: [],
        });
        closeModal();
        toast("Procurement created", ref, "success");
        open_(ref);

      /* ======================================================================

   ====================================================================== */

      const CHAT_SUGGESTIONS = [
        "Is anything required by RA 12009 missing from this document?",
        "Do the amounts in this document agree with each other?",
        "Does this specification look restrictive to one brand?",
        "Summarise the deliverables and payment terms.",
      ];

      /* Canned replies for the prototype — matched on keywords, in order. */
      const CHAT_REPLIES = [
        {
          match: /miss|complete|require|ra ?12009|compliance|provision/i,
          text:
            "Reading the attached document, two items look worth checking:\n\n" +
            "• The Instructions to Bidders moves from the bid security forms straight to the opening of bids — the provision on the Bid Securing Declaration does not appear.\n" +
            "• One signature block and the date of approval on the BAC Resolution are blank.\n\n" +
            "This is a quick read, not a recorded review. Create a procurement record and run the AI Review if you want these captured as findings with citations.",

          text:
            "The scoring engine clause names a proprietary baseline index and a native .brx export format. Together those narrow the field to a small number of providers.\n\n" +
            'That is a point for the BAC to consider rather than a conclusion. If the requirement is genuine, stating it as an outcome, or adding "or equivalent" with published equivalence criteria, keeps the specification open.',
        },
        {
          match: /deliverable|payment|term|warranty|support|scope/i,
          text:
            "From the attached document:\n\n" +
            "• Payment is in two tranches — 50% on activation and acceptance testing, 50% on the Certificate of Final Acceptance.\n" +
            '• Support is required "for the duration of the engagement", with no hours, response times or post-expiry coverage stated.\n' +
            "• End-of-subscription deliverables are not listed, so there is nothing definite to accept against.",
        },
      ];
      const CHAT_FALLBACK =
        "I can only work from what is attached here, and this is a sanity check rather than a recorded review. " +
        "Ask me about missing requirements, amounts that do not reconcile, restrictive specifications, or the deliverables and payment terms — " +
        "or create a procurement record and run the full AI Review to get findings with citations that the BAC can act on.";

      function assistantPage() {

      c.msgs.length
        ? `<button onclick="clearChat()" class="${btnGhost} flex items-center gap-1.5"><i data-lucide="eraser" class="h-3.5 w-3.5"></i> Clear</button>`

      <span class="h-10 w-10 rounded-full bg-sky grid place-items-center mx-auto"><i data-lucide="message-square" class="h-5 w-5 text-blue"></i></span>
      <h3 class="text-[14px] font-semibold text-navy mt-3">Quick document check</h3>
      <p class="text-[13px] text-muted mt-1 max-w-md mx-auto">Attach a document and ask a question. Useful for a sanity check before a procurement record is created.</p>
      <div class="flex flex-wrap justify-center gap-2 mt-5">
        ${CHAT_SUGGESTIONS.map(
          (s) => `<button onclick="askChat(this.dataset.q)" data-q="${esc(s)}"
          class="rounded-full border border-line bg-white px-3.5 py-1.5 text-[12px] text-muted hover:border-blue hover:text-blue transition-colors">${esc(s)}</button>`,
        ).join("")}
      </div>
    </div>`;
        }
        return c.msgs
          .map((m) =>
            m.role === "user"
              ? `<div class="flex justify-end fade-up"><div class="max-w-[80%] rounded-xl rounded-br-sm bg-blue text-white px-4 py-2.5 text-[13px] leading-relaxed">${nl2br(m.text)}</div></div>`
              : `<div class="flex gap-3 fade-up">
        <span class="h-7 w-7 rounded-full bg-sky grid place-items-center shrink-0"><i data-lucide="sparkles" class="h-3.5 w-3.5 text-blue"></i></span>
        <div class="max-w-[80%] rounded-xl rounded-bl-sm border border-line bg-page px-4 py-2.5 text-[13px] leading-relaxed">${
          m.pending
            ? `<span class="inline-flex items-center gap-2 text-muted"><span class="h-3 w-3 rounded-full border-2 border-blue border-t-transparent spin"></span>Reading the document…</span>`
            : nl2br(m.text)
        }</div>
      </div>`,
          )
          .join("");
      }

      function renderChatThread() {
        const el = $("chatThread");
        if (el) {
          el.innerHTML = chatThread();
          icons();
          scrollChat();
        }
      }
      function scrollChat() {
        const el = $("chatThread");
        if (el) el.scrollTop = el.scrollHeight;
      }

      function attachChatDocs() {
        const have = state.chat.docs.map((d) => d.name);
        const pool = seedDocuments().filter((d) => !have.includes(d.name));
        if (!pool.length) {
          toast(
            "All sample documents are attached",
            "Nothing further to add.",
            "warn",
          );
          return;
        }
        state.chat.docs.push(pool[0]);
        toast(
          "Document attached",
          pool[0].name + " · not saved to any procurement",
        );
        render();
      }
      function detachChatDoc(i) {
        state.chat.docs.splice(i, 1);
        render();
      }

      function askChat(q) {
        const el = $("chatInput");
        if (el) el.value = q;
        sendChat();
      }
      function chatKey(e) {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendChat();
        }
      }

      function sendChat() {
        const c = state.chat,
          el = $("chatInput");
        const text = (el?.value || "").trim();
        if (!text || c.busy) return;
        if (!c.docs.length) {
          toast(
            "No document attached",
            "Attach a document for the assistant to read.",
            "warn",
          );
          return;
        }

        el.value = "";
        c.msgs.push({ role: "user", text });
        c.msgs.push({ role: "ai", text: "", pending: true });
        c.busy = true;
        renderChatThread();

        setTimeout(() => {
          const reply = CHAT_REPLIES.find((r) => r.match.test(text));
          const last = c.msgs[c.msgs.length - 1];
          last.pending = false;
          last.text = reply ? reply.text : CHAT_FALLBACK;
          c.busy = false;
          renderChatThread();
        }, 1100);
      }

      function clearChat() {
        state.chat = { docs: [], msgs: [], busy: false };
        render();
        toast("Conversation cleared", "Nothing from this chat was saved.");
      }

      /* ======================================================================
   KNOWLEDGE HUB
   ====================================================================== */

      function hubPage() {
        const rows = KNOWLEDGE.filter(
          (k) =>
            (state.kbCat === "all" || k.cat === state.kbCat) &&
            (!state.kbSearch.trim() ||
              (k.title + " " + k.subtitle + " " + k.excerpt)
                .toLowerCase()
                .includes(state.kbSearch.toLowerCase())),
